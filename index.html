<!DOCTYPE html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Codaluna – Python lernen</title>
    <meta name="description" content="Lerne Python Schritt für Schritt: echter Code direkt im Browser, offline nutzbar, ohne Anmeldung." />
    <!-- Theme früh setzen (kein Flackern) -->
    <script>
      (function () {
        var theme = "dark";
        try { theme = localStorage.getItem("pyquest.theme") || "dark"; } catch (e) {}
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      })();
    </script>
    <meta name="theme-color" content="#121110" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/vendor/codemirror/lib-codemirror.css" />
    <link rel="stylesheet" href="/src/css/design.css" />
    <link rel="stylesheet" href="/src/css/app.css" />
  </head>
  <body>
    <!-- Kurzer Startbildschirm, bis die erste Lektion gezeichnet ist (Python lädt danach im Hintergrund) -->
    <div class="boot" id="boot">
      <div class="box">
        <div class="spinner"></div>
        <div class="big">Codaluna</div>
        <noscript>Bitte JavaScript aktivieren. · Please enable JavaScript.</noscript>
      </div>
    </div>

    <div id="app">
      <header class="header">
        <button class="help-btn" id="menu-btn" data-i18n-aria="a11y.menu" aria-label="Menü" aria-expanded="false" aria-controls="sidebar"><i data-icon="menu" data-size="20"></i></button>
        <div class="brand">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 2 27.86 8.5v13L16 30 4.14 21.5v-13z" fill="none"
                  stroke="#3ccfb0" stroke-width="2" stroke-linejoin="round" />
            <path d="M12 12l4 4-4 4M18 20h4" fill="none" stroke="#f2a93b"
                  stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="name">Py<b>Quest</b></span>
        </div>
        <div class="header-spacer"></div>

        <button class="stats-btn" id="stats-btn" type="button" aria-haspopup="dialog" data-i18n-aria="stat.open" aria-label="Fortschritt">
          <span class="stat" data-kind="week">
            <span class="week-dots" id="week-dots" aria-hidden="true"></span>
            <span class="val" id="week-val">0/3</span>
            <span class="stat-label" data-i18n="stat.weekLabel">Woche</span>
          </span>
          <span class="xp-wrap">
            <span class="stat-label" data-i18n="stat.levelLabel">Level</span>
            <span class="level-badge" id="level-badge">1</span>
            <span class="xp-bar"><span class="xp-fill" id="xp-fill"></span></span>
          </span>
        </button>

        <div class="lang-wrap">
          <button class="help-btn" id="lang-btn" type="button" data-i18n-title="lang.btn" data-i18n-aria="lang.btn" title="Sprache"
                  aria-haspopup="true" aria-expanded="false" aria-controls="lang-menu"><i data-icon="globe"></i></button>
          <div class="lang-menu" id="lang-menu" role="menu" hidden></div>
        </div>
        <button class="help-btn" id="sound-btn" type="button" data-i18n-title="sound.toggle" data-i18n-aria="sound.toggle" title="Sound" aria-pressed="true"><i data-icon="sound"></i></button>
        <button class="help-btn" id="theme-btn" type="button" data-i18n-title="theme.toggle" data-i18n-aria="theme.toggle" title="Theme"><i data-icon="contrast"></i></button>
        <button class="help-btn" id="install-btn" type="button" data-i18n-title="install.btn" data-i18n-aria="install.btn" title="Install" hidden><i data-icon="download"></i></button>
        <button class="help-btn" id="offline-btn" type="button" data-i18n-title="offline.btn" data-i18n-aria="offline.btn" title="Offline"><i data-icon="download"></i></button>
        <button class="help-btn" id="help-btn" type="button" data-i18n-title="help.btn" data-i18n-aria="help.btn" title="Help"><i data-icon="help"></i></button>
      </header>

      <div class="body">
        <nav class="sidebar" id="sidebar" data-i18n-aria="a11y.lessons" aria-label="Lektionen"></nav>
        <div class="scrim" id="scrim"></div>

        <main class="workspace" id="workspace">
          <div class="mtabs" id="mtabs" role="tablist">
            <button class="mtab active" type="button" data-tab="task" role="tab" aria-selected="true" aria-controls="lesson-pane" data-i18n="tab.task">Aufgabe</button>
            <button class="mtab" type="button" data-tab="code" role="tab" aria-selected="false" aria-controls="editor-col" data-i18n="tab.code">Code &amp; Konsole</button>
          </div>
          <section class="lesson-pane" id="lesson-pane" data-i18n-aria="a11y.lesson" aria-label="Lektion"></section>

          <div class="editor-col" id="editor-col">
            <div class="toolbar">
              <button class="btn btn-primary" id="run-btn" type="button" data-i18n-title="btn.runTitle" title="Run" disabled>
                <span class="run-ico" aria-hidden="true"><i data-icon="play" data-size="16"></i></span> <span class="btxt" id="run-label" data-i18n="btn.run">Ausführen</span>
              </button>
              <button class="btn btn-danger" id="stop-btn" type="button" disabled data-i18n-title="btn.stopTitle" title="Stop"><i data-icon="stop" data-size="16"></i> <span class="btxt" data-i18n="btn.stop">Stop</span></button>
              <div class="spacer"></div>
              <button class="btn btn-ghost" id="share-btn" type="button" data-i18n-title="btn.shareTitle" title="Share"><i data-icon="link"></i> <span class="btxt" data-i18n="btn.share">Teilen</span></button>
              <button class="btn btn-ghost" id="reset-btn" type="button" data-i18n-title="btn.resetTitle" title="Reset"><i data-icon="reset"></i> <span class="btxt" data-i18n="btn.reset">Zurücksetzen</span></button>
              <button class="btn btn-ghost" id="solution-btn" type="button" data-i18n-title="btn.solutionTitle" title="Solution"><i data-icon="eye"></i> <span class="btxt" data-i18n="btn.solution">Lösung</span></button>
            </div>

            <div class="editor-host" id="editor-host"></div>

            <div class="console">
              <div class="console-head">
                <span class="dot" id="console-dot" aria-hidden="true"></span>
                <span class="buddy" id="buddy" aria-hidden="true"></span>
                <span data-i18n="console.head">Konsole</span>
                <span class="console-status" id="console-status" aria-live="polite"></span>
                <span class="spacer"></span>
                <button class="console-clear" id="console-clear" type="button" data-i18n-title="console.clear" data-i18n-aria="console.clear" title="Clear"><i data-icon="eraser" data-size="16"></i></button>
              </div>
              <div class="console-out" id="console-out" role="log" aria-live="polite" data-i18n-aria="console.outAria" aria-label="Ausgabe"></div>
              <div class="console-input" id="console-input">
                <span class="prompt" aria-hidden="true">›</span>
                <input id="console-input-field" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"
                       data-i18n-aria="console.inputAria" data-i18n-ph="console.inputPlaceholder"
                       aria-label="Eingabe für dein Programm" placeholder="Eingabe … (Enter)" />
                <button class="btn btn-ghost input-send" id="console-input-send" type="button" data-i18n-aria="console.send" aria-label="Senden"><i data-icon="enter"></i></button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden />

    <!-- CodeMirror 5 (klassische Skripte, definieren window.CodeMirror) -->
    <script src="/vendor/codemirror/lib-codemirror.js"></script>
    <script src="/vendor/codemirror/mode/python/python.js"></script>
    <script src="/vendor/codemirror/addon/edit/matchbrackets.js"></script>
    <script src="/vendor/codemirror/addon/edit/closebrackets.js"></script>

    <!-- App -->
    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
